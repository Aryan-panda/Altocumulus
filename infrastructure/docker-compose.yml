version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demopassword
      POSTGRES_DB: cloudplatform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d cloudplatform"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://demo:demopassword@postgres:5432/cloudplatform
      - DEMO_MODE=true
    volumes:
      - ../services/api:/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

